<!DOCTYPE html>
<html>
<head>
    <title> Menu page </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='menu.css')}}">
    <!-- CHATBOT (1/3): chatbot styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>
    <header>
    <div class="logo">  
    <img src="{{url_for('static', filename='images/CB logo.png')}}" alt="logo">
    <a href="/"><p>CanteenBite</p>
    </a>
    </div>
    <nav>
    <a href="/">Home</a>
    <a href="/menu" class="menu">Menu</a>
    <a href="/cart" class="cart-link" onclick="removeNotification()">Cart <span id="cart-dot"></span></a>
    <a href="/orders">Orders</a>
    </nav>
    </header>

    
    <h1>Menu</h1>

<form action="/menu" method="post">
<div class="search-bar">
    <input type="search" name="search" placeholder="Search for Food items...">
    <button type="submit">Search</button><br><br>
</div>
</form>
    
<form action="/menu" method="post">
<div class="categories">
    <button type="submit" name="category" value="All">All</button>
    <button type="submit" name="category" value="Snacks">Snacks</button>
    <button type="submit" name="category" value="Food">Meals</button>
    <button type="submit" name="category" value="Drinks">Drinks</button>
</div>
</form>

<div class="food-grid">

    {% for product in products %}

    <div class="card" data-aos="fade-up" data-aos-duration="1500">
        <img src=" {{ url_for('static', filename='images/'+ product.image) }} " alt="{{ product.name }}">

        <h3>{{ product.name }}</h3>
        <p>&#8377; {{ product.price }}</p>

        <form class="add-cart-form" action="/add_to_cart" method="POST">

            <input type="hidden" name="product_name" value= "{{ product.name }}">
            <input type="hidden" name="price" value=" {{ product.price }} ">
            <button type="submit" class="add-btn"> Add to Cart </button>
        </form>
    </div>
{% endfor %}
<div id="cart-message"></div>
</div>

<footer><p>Copyright © CanteenBite</p></footer>

<button id="chatbot-toggle" class="chatbot-toggle" type="button"
        aria-label="Open CanteenBite AI Assistant" aria-expanded="false" aria-controls="chatbot-window">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.4-.7L3 21l1.9-5.3A8.4 8.4 0 1 1 21 11.5z"/>
    </svg>
</button>

<section id="chatbot-window" class="chatbot-window" role="dialog"
         aria-label="CanteenBite AI Assistant" aria-hidden="true">

    <div class="chatbot-header">
        <div>
            <h2>CanteenBite AI Assistant</h2>
            <span id="chatbot-mode" class="chatbot-mode">Checking mode...</span>
        </div>
        <button id="chatbot-close" class="chatbot-close" type="button" aria-label="Close chat">&times;</button>
    </div>

    <div id="chatbot-messages" class="chatbot-messages" aria-live="polite"></div>

    <div id="chatbot-suggestions" class="chatbot-suggestions">
        <button type="button">What's on the menu?</button>
        <button type="button">What do you recommend?</button>
        <button type="button">Check my order status</button>
        <button type="button">How does the token work?</button>
    </div>

    <div class="chatbot-input-row">
        <input id="chatbot-input" type="text" maxlength="300" autocomplete="off"
               placeholder="Ask about food, prices, orders...">
        <button id="chatbot-send" class="chatbot-send" type="button" aria-label="Send message">Send</button>
    </div>
</section>

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
  <script>
    document.querySelectorAll(".add-cart-form").forEach(form => {
        form.addEventListener("submit",function(event){
            event.preventDefault();

            fetch("/add_to_cart",{
                method: "POST",
                body: new FormData(form)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage(data.message);
                    localStorage.setItem("cartNotification","true");
                    document.getElementById("cart-dot").classList.add("show");
                }
            })
            .catch(error => {
                console.error("Error:",error);
            });
        });
    }); 
    function showMessage(message) {
        const popup = document.getElementById("cart-message");

        popup.innerText = "✔️" + message;
        popup.classList.add("show");

        setTimeout(() => {
            popup.classList.remove("show");
        }, 2000);
    }
  </script>
  <script>
    window.addEventListener("DOMContentLoaded", function() {
        if (localStorage.getItem("cartNotification") === "true") {
            document.getElementById("cart-dot").classList.add("show");
        }
    });
    function removeNotification() {
        localStorage.removeItem("cartNotification");
        document.getElementById("cart-dot").classList.remove("show");
    }
  </script>
  <!-- CHATBOT (3/3): chatbot logic -->
  <script src="{{ url_for('static', filename='chatbot.js') }}"></script>
</body>
</html>
