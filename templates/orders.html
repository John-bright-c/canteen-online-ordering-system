<!DOCTYPE html>
<html>
    <head>
        <title> Menu page </title>
    </head>
    <link rel="stylesheet" href="{{url_for('static',filename='orders.css')}}">
    <link rel="stylesheet" href="orders.css">
<body>
    
    <header>
    <div class="logo">  
    <img src="{{url_for('static', filename='images/CB logo.png')}}" width="50">
    <a href="/" class="cb"><p>CanteenBite</p>
    </a>
    </div>
    <nav>
    <a href="/">Home</a>
    <a href="/menu" class="menu">Menu</a>
    <a href="/cart">Cart</a>
    <a href="/orders">Orders</a>
    </nav>
    </header>

<h1><b>My Orders</b></h1>

<div class="container">

    <div class="heading">
        <div>Token</div>
        <div>Product</div>
        <div>Qty</div>
        <div>Total</div>
        <div>Status</div>
    </div>

    {% for order in orders %}
    <div class="order-row">
        <div>{{ order.token_no }}</div>
        <div>{{ order.product_name }}</div>
        <div>{{ order.quantity }}</div>
        <div>₹{{ order.total }}</div>
        <div class="status">{{ order.order_status }}</div>
    </div>
    {% endfor %}

</div>


<footer><p>Copyright © CanteenBite</p></footer>

</body>
</html>
