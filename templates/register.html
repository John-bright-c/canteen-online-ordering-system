<html>
<head>
    <title>Register to CanteenBite</title>
</head>
<link rel="stylesheet" href="{{url_for('static', filename='register.css')}}">
<link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css">
<body>
<header>CanteenBites</header>
<img src="{{url_for('static',filename = 'images/CB Logo.png')}}" alt="logo" class="logo">

<div class="container" data-aos="fade-down" data-aos-duration="3000">
<form action="/register" method="POST">
<h1>Register to CanteenBite</h1>
<p>Full Name</p>
<input type="text" placeholder="John Bright C" name="full_name" required>
<p>Registration Number</p>
<input type="text" placeholder="U18CM24S0090" name="register_no" required>
<p>Email Address</p>
<input type="email" placeholder="name@example.com" name="email" required>
<p>Set Your Password</p>
<input type="password" name="password" required><br><br><br>

    <button type="submit" class="register">Register</button>
</form>


<div class="copyright">
    copyright@CanteenBite
</div>
</div>

<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>

</script>
</body>
</html>
